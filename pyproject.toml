[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ikki"
version = "0.0.0"
description = "面向学习的 Coding Agent。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ikki = "ikki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
